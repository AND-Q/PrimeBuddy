[project]
name = "primebuddy"
version = "0.1.0"
description = "面向 408 考研的个人学习 Agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dashscope>=1.25.18,<2",
    "langchain>=1.5,<2",
    "langchain-chroma>=1.1.0,<2",
    "langchain-community>=0.4.1,<0.5",
    "langchain-openai>=1.2.1,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.2,<2",
    "pypdf>=6.11.0,<7",
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "ruff",
]
